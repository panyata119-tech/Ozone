services:
  - type: web
    name: line-group-guardian
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: LINK_BLOCK
        value: "true"
      - key: SPAM_WINDOW_MS
        value: "10000"
      - key: SPAM_LIMIT
        value: "5"
      - key: WARN_LIMIT
        value: "3"